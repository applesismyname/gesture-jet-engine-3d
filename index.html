<!DOCTYPE html>
<!-- #dev/creator-tubakhxn -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jet Engine</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <svg id="leader" aria-hidden="true">
    <line id="leaderLine" x1="0" y1="0" x2="0" y2="0" />
    <circle id="leaderDot" cx="0" cy="0" r="3.5" />
  </svg>
  <div id="tag" aria-live="polite"></div>

  <div id="cam-wrap">
    <div class="cam-frame">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="cam-status" class="warn">STARTING CAMERA…</div>
  </div>

  <h1 id="title">JET ENGINE</h1>

  <div id="gesture-label"><span id="g-glyph"></span><span id="g-name">show your hand</span></div>
  <div id="hint">✋ palm · ✌ two fingers · 3 fingers · ✊ fist &nbsp;|&nbsp; keys 1 2 3 4 · R reset · H camera</div>

  <noscript><p class="noscript">This app needs JavaScript.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
